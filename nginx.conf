
events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name localhost;

        # Route transactions requests to JavaScript
        location /api/transactions {
            proxy_pass http://transactions:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Route banking requests to Flask backend
        location /api/ {
            proxy_pass http://backend:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Route remaining requests to student portfolio
        location / {
            proxy_pass http://studentportfolio:80;
            proxy_set_header Host $host;
        }
    }
}
